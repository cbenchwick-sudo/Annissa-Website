<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annissa - Meet Our Team</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Annissa</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#team">Team</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="team">
            <h2>Meet Our Team</h2>
            <div class="team-grid">
                <div class="team-member">
                    <img src="Emily.png" alt="Emily">
                    <h3>Emily</h3>
                </div>
                <div class="team-member">
                    <img src="Alissa.png" alt="Alissa">
                    <h3>Alissa</h3>
                </div>
            </div>
        </section>

        <section id="projects">
            <h2>Our Projects</h2>
            <div class="projects-grid">
                <div class="project-card">
                    <div class="slideshow" data-slideshow>
                        <div class="slides">
                            <img src="20220412 Darke County Airport Terminal.jpg" alt="Darke County Airport Terminal" class="slide active">
                            <img src="20221025 Darke Co Airport v1.jpg" alt="Darke County Airport View 1" class="slide">
                            <img src="20221028 Darke Co Airport v2.jpg" alt="Darke County Airport View 2" class="slide">
                        </div>
                        <button class="slide-btn prev">&#10094;</button>
                        <button class="slide-btn next">&#10095;</button>
                        <div class="slide-dots">
                            <span class="dot active"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                    </div>
                    <h3>Darke County Airport</h3>
                    <p>Versailles, OH</p>
                </div>

                <div class="project-card">
                    <div class="slideshow" data-slideshow>
                        <div class="slides">
                            <img src="IMG_4949.jpg" alt="YSU Project Photo 1" class="slide active">
                            <img src="IMG_4952.jpg" alt="YSU Project Photo 2" class="slide">
                            <img src="IMG_4954.jpg" alt="YSU Project Photo 3" class="slide">
                            <img src="IMG_4955.jpg" alt="YSU Project Photo 4" class="slide">
                        </div>
                        <button class="slide-btn prev">&#10094;</button>
                        <button class="slide-btn next">&#10095;</button>
                        <div class="slide-dots">
                            <span class="dot active"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                    </div>
                    <h3>Youngstown State University</h3>
                    <p>Youngstown, OH</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.querySelectorAll('[data-slideshow]').forEach(function(slideshow) {
            const slides = slideshow.querySelectorAll('.slide');
            const dots = slideshow.querySelectorAll('.dot');
            let current = 0;

            function show(index) {
                slides.forEach(s => s.classList.remove('active'));
                dots.forEach(d => d.classList.remove('active'));
                current = (index + slides.length) % slides.length;
                slides[current].classList.add('active');
                dots[current].classList.add('active');
            }

            slideshow.querySelector('.prev').addEventListener('click', () => show(current - 1));
            slideshow.querySelector('.next').addEventListener('click', () => show(current + 1));
            dots.forEach((dot, i) => dot.addEventListener('click', () => show(i)));

            setInterval(() => show(current + 1), 4000);
        });
    </script>

    <footer>
        <p>&copy; 2026 Annissa. All rights reserved.</p>
    </footer>
</body>
</html>
