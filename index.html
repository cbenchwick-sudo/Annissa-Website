<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annissa - Meet Our Team</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Annissa</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#team">Team</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="team">
            <h2>Meet Our Team</h2>
            <div class="team-grid">
                <div class="team-member">
                    <img src="Emily.png" alt="Emily">
                    <h3>Emily</h3>
                </div>
                <div class="team-member">
                    <img src="Alissa.png" alt="Alissa">
                    <h3>Alissa</h3>
                </div>
            </div>
        </section>

        <section id="projects">
            <h2>Our Projects</h2>
            <div class="project-card">
                <div class="slideshow">
                    <div class="slides">
                        <img src="20220412 Darke County Airport Terminal.jpg" alt="Darke County Airport Terminal" class="slide active">
                        <img src="20221025 Darke Co Airport v1.jpg" alt="Darke County Airport View 1" class="slide">
                        <img src="20221028 Darke Co Airport v2.jpg" alt="Darke County Airport View 2" class="slide">
                    </div>
                    <button class="slide-btn prev" onclick="changeSlide(-1)">&#10094;</button>
                    <button class="slide-btn next" onclick="changeSlide(1)">&#10095;</button>
                    <div class="slide-dots">
                        <span class="dot active" onclick="goToSlide(0)"></span>
                        <span class="dot" onclick="goToSlide(1)"></span>
                        <span class="dot" onclick="goToSlide(2)"></span>
                    </div>
                </div>
                <h3>Darke County Airport</h3>
                <p>Versailles, OH</p>
            </div>
        </section>
    </main>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }

        function goToSlide(index) {
            showSlide(index);
        }

        // Auto-advance every 4 seconds
        setInterval(() => changeSlide(1), 4000);
    </script>

    <footer>
        <p>&copy; 2026 Annissa. All rights reserved.</p>
    </footer>
</body>
</html>
