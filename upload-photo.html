<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Emily's Photo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 700px;
            margin: 2rem auto;
            padding: 1rem;
            color: #333;
        }
        h1 { color: #2c3e50; }
        .steps { background: #f8f9fa; padding: 1.5rem; border-radius: 8px; margin: 1rem 0; }
        .steps li { margin: 0.5rem 0; }
        .upload-area {
            border: 3px dashed #2c3e50;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin: 1.5rem 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .upload-area:hover { background: #eef2f7; }
        .upload-area img {
            max-width: 250px;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 1rem;
        }
        button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background: #34495e; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        #status { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
        #status.success { display: block; background: #d4edda; color: #155724; }
        input[type="file"] { display: none; }
        .preview-label { color: #666; font-size: 0.9rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>Upload Emily's Photo</h1>

    <div class="steps">
        <strong>How it works (2 easy steps):</strong>
        <ol>
            <li>Click the box below and select Emily's photo from your computer</li>
            <li>Click "Save Photo to Website" — done!</li>
        </ol>
    </div>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p><strong>Click here to choose Emily's photo</strong></p>
        <p style="color: #666; font-size: 0.9rem;">Supports JPG, PNG, or WebP</p>
        <img id="preview" style="display:none;">
        <p class="preview-label" id="previewLabel" style="display:none;">Preview:</p>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <button id="saveBtn" disabled onclick="savePhoto()">Save Photo to Website</button>

    <div id="status"></div>

    <script>
        let imageDataUrl = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                imageDataUrl = event.target.result;
                const preview = document.getElementById('preview');
                preview.src = imageDataUrl;
                preview.style.display = 'block';
                document.getElementById('previewLabel').style.display = 'block';
                document.getElementById('dropZone').querySelector('p').textContent = file.name;
                document.getElementById('saveBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        });

        function savePhoto() {
            if (!imageDataUrl) return;

            // Build the complete index.html with the embedded image
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annissa - Meet Our Team</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; line-height: 1.6; }
        header { background: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.8rem; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; font-size: 1rem; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        #team { text-align: center; padding: 2rem 0; }
        #team h2 { font-size: 2rem; margin-bottom: 2rem; color: #2c3e50; }
        .team-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; }
        .team-member { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; width: 280px; transition: transform 0.3s; }
        .team-member:hover { transform: translateY(-5px); }
        .team-member img { width: 100%; height: 320px; object-fit: cover; }
        .team-member h3 { padding: 1rem; font-size: 1.3rem; color: #2c3e50; }
        footer { background: #2c3e50; color: white; text-align: center; padding: 1rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>Annissa</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#team">Team</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="team">
            <h2>Meet Our Team</h2>
            <div class="team-grid">
                <div class="team-member">
                    <img src="${imageDataUrl}" alt="Emily">
                    <h3>Emily</h3>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Annissa. All rights reserved.</p>
    </footer>
</body>
</html>`;

            // Download the file
            const blob = new Blob([html], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            link.click();

            const status = document.getElementById('status');
            status.className = 'success';
            status.innerHTML = '<strong>Done!</strong> Your <code>index.html</code> file has been downloaded. It contains Emily\'s photo embedded directly — just open it in any browser to see your website.';
        }
    </script>
</body>
</html>
